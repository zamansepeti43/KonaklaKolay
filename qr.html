<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KonaklaKolay — QR Kod</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 16px;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(100%,440px);background:#fff;border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 12px 40px #16203312}h1{margin:0 0 8px;font-size:27px}p{color:#667085;line-height:1.5}.qr{display:block;width:min(100%,300px);height:auto;margin:22px auto;border:10px solid white}.url{overflow-wrap:anywhere;font-size:13px;background:#f4f6f8;padding:12px;border-radius:10px}button{border:0;border-radius:12px;padding:14px 18px;background:#174e43;color:white;font-size:16px;font-weight:700;width:100%;margin-top:12px}small{display:block;margin-top:16px;color:#667085}
@media print{body{background:white;padding:0}.card{box-shadow:none}.noprint{display:none}.qr{width:300px}}
</style>
</head>
<body><main class="card">
<h1>KonaklaKolay</h1>
<p>Misafir rehberini açmak için telefon kameranızla bu QR kodu okutun.</p>
<img class="qr" alt="KonaklaKolay misafir rehberi QR kodu" src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=12&data=https%3A%2F%2Fzamansepeti43.github.io%2FKonaklaKolay%2F">
<div class="url">https://zamansepeti43.github.io/KonaklaKolay/</div>
<button class="noprint" onclick="window.print()">QR kodunu yazdır / PDF kaydet</button>
<small>Not: Bu QR kod mevcut demo sayfasını açar. Gerçek işletmeye vermeden önce otel adı, Wi-Fi ve iletişim bilgilerini değiştirin.</small>
</main></body></html>
